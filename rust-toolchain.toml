# Nightly, because development builds use the Cranelift backend and `-Zshare-generics`
# (see `.cargo/config.toml`).
[toolchain]
channel = "nightly-2026-10-11"
components = ["clippy", "rust-analyzer", "rust-src", "rustc-codegen-cranelift-preview", "rustfmt"]
# The browser, and Windows, which is built from Linux (see the README).
targets = ["wasm32-unknown-unknown", "x86_64-pc-windows-gnu"]
