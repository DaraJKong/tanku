# The checks that every change must pass (see "Checks" in the README), run by GitHub on every
# push. Linux runs all of them. Windows runs the tests that tanku_client/dev/windows.sh runs
# under wine, on a real Windows this time, and Clippy on the client. The browser can't run the
# tests, so Clippy reads the client as it is compiled for the page.
name: Checks

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the checks of the older one pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lines for a backtrace and no more: with full debug information, the checks of Linux leave
  # 11 GB in `target`, nearly all that a machine of GitHub has free, and they would fill the
  # cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The machine comes with the tools of other languages, which leave little room for a
      # build of the engine and its tests.
      - name: Make room on the disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The linker of development builds (clang with mold, see .cargo/config.toml), and the
      # libraries that the engine is built against: sound, gamepads, windows.
      - name: Install what the system lends the build
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang mold pkg-config \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      # The nightly of rust-toolchain.toml, with its components and its targets.
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The server without the client's features
        run: cargo check -p tanku_server
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      # As in windows.sh: Cranelift is not tried on Windows.
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Tests of the rules and of the sound
        run: cargo test -p tanku_core -p tanku_audio --no-fail-fast
      # A development build links the engine dynamically, which crashes on Windows: the
      # server leaves the development features out.
      - name: Tests of the simulation
        run: cargo test -p tanku_server --no-default-features --features net --no-fail-fast
      # The client as a release for Windows has it.
      - name: Clippy on the client
        run: cargo clippy -p tanku_client --no-default-features -- -D warnings

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build scripts run on the machine itself, and are linked as its development builds are.
      - name: Install the linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang mold
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # As tanku_client/web/build.sh compiles it for the page.
      - name: Clippy on the client for the browser
        run: cargo clippy -p tanku_client --target wasm32-unknown-unknown --no-default-features -- -D warnings
