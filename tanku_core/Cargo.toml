[package]
name = "tanku_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["std", "serialize"] }
lightyear = { workspace = true, features = [
    "std",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
] }
serde.workspace = true
sha2.workspace = true

# A browser can't announce a game or look for one: it has no socket of its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mdns-sd.workspace = true

[dev-dependencies]
criterion.workspace = true

[features]
# What the tests of the other crates take from this one: see `testing.rs`. With it, this crate
# is compiled with the balance of the tests, `test.balance`, as it is for its own tests.
testing = []
# Runs the tests on the balance of the game, `game.balance`, all the same. A test that holds
# a number of the balance of the tests then fails where the two differ.
game-balance = []

[[bench]]
name = "generation"
harness = false
