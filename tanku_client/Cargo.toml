[package]
name = "tanku_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "bevy_audio", "wav"] }
# Every build joins games of several players. Over WebTransport it joins as a browser must,
# which a desktop build can do too.
lightyear = { workspace = true, features = ["client", "netcode", "webtransport"] }
tanku_audio.workspace = true
tanku_core.workspace = true
tanku_server.workspace = true

# A desktop build also hosts them, and joins the games of other desktops over UDP. A host
# copies the link for browsers from its lobby, which takes the clipboard of the system.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["system_clipboard"] }
lightyear = { workspace = true, features = ["server", "udp"] }
tanku_server = { workspace = true, features = ["net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "Crypto",
    "GainNode",
    "Location",
    "Performance",
    "Storage",
    "Window",
] }

# Development conveniences, enabled by default.
# Build releases with `--no-default-features`.
[features]
default = ["development", "debug"]
# A development build links the engine dynamically, which compiles faster, and takes scripts.
development = ["script", "bevy/dynamic_linking"]
# The tools of `dev.rs`: a game that plays what `TANKU_DEV_SCRIPT` holds, without a window. On
# its own, with `--no-default-features --features script`, it gives a build that stands alone
# and still takes scripts, to check a release build or one for another system.
script = []
debug = ["bevy/debug"]
