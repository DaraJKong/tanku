[package]
name = "tanku_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "bevy_audio", "wav"] }
tanku_audio.workspace = true
tanku_core.workspace = true
tanku_server.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "Storage",
    "Window",
] }

# Development conveniences, enabled by default.
# Build releases with `--no-default-features`.
[features]
default = ["development", "debug"]
development = ["bevy/dynamic_linking"]
debug = ["bevy/debug"]
