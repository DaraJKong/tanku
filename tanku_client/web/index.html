<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanku</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <script>
      // A browser lets no sound play before the first click or key, and the game asks for its
      // sound when it starts, which is too early. It is asked again here, for every source of
      // sound that the game makes, each time the player does something that a browser counts.
      const sounds = [];
      const Sound = window.AudioContext;
      window.AudioContext = class extends Sound {
        constructor(...options) {
          super(...options);
          sounds.push(this);
        }
      };
      const start = () => {
        if (!document.hidden) {
          sounds.forEach((sound) => sound.resume().catch(() => {}));
        }
      };
      for (const action of ["keydown", "mousedown", "pointerdown", "pointerup", "touchend"]) {
        addEventListener(action, start, true);
      }
      // A page that isn't shown draws no frame, so the game stands still there. Its sound stops
      // with it, and comes back with the page.
      document.addEventListener("visibilitychange", () => {
        sounds.forEach((sound) => (document.hidden ? sound.suspend() : sound.resume()).catch(() => {}));
      });

      // A host hands out a link, which ends with where its game is. The game follows what the
      // address of the page ends with, so a link that is pasted into the page is put there.
      // The game takes every key for itself, which would keep the browser from pasting: the
      // keys that paste are kept from the game.
      addEventListener(
        "keydown",
        (key) => {
          if ((key.ctrlKey || key.metaKey) && key.key.toLowerCase() === "v") {
            key.stopImmediatePropagation();
          }
        },
        true,
      );
      addEventListener("paste", (pasted) => {
        const text = pasted.clipboardData ? pasted.clipboardData.getData("text") : "";
        const end = text.slice(text.lastIndexOf("#") + 1).trim();
        if (/^[0-9.:]+\/[0-9a-fA-F]{64}$/.test(end)) {
          location.hash = end;
        }
      });

      // A game that was joined tells its news in packets, and the page reads each one into a
      // buffer that it hands to the browser. Firefox refuses that way of reading packets: it
      // only hands out whole ones. Where the browser refuses, the page is given a reader that
      // takes whole packets and copies each into the buffer that was handed over, which is
      // larger than any packet.
      const getReader = ReadableStream.prototype.getReader;
      ReadableStream.prototype.getReader = function (options) {
        try {
          return getReader.call(this, options);
        } catch (refused) {
          if (!options || options.mode !== "byob") {
            throw refused;
          }
          const whole = getReader.call(this);
          return {
            read: async (view) => {
              const { value, done } = await whole.read();
              if (done) {
                return { value: undefined, done };
              }
              const read = new Uint8Array(view.buffer, view.byteOffset, value.byteLength);
              read.set(value);
              return { value: read, done };
            },
            releaseLock: () => whole.releaseLock(),
            cancel: (reason) => whole.cancel(reason),
            get closed() {
              return whole.closed;
            },
          };
        }
      };
    </script>
    <script src="./probe.js"></script>
    <script type="module">
      import init from "./tanku.js";
      init();
    </script>
  </body>
</html>
