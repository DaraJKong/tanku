[package]
name = "tanku_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Headless: no window and no renderer.
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_log"] }
# For games of several players. A web build has no server that others can reach. Desktop
# games are listened for over UDP, and browsers over WebTransport, with a certificate that the
# game makes for itself.
lightyear = { workspace = true, optional = true, features = [
    "server",
    "netcode",
    "udp",
    "webtransport",
    "webtransport_self_signed",
] }
tanku_core.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "simulation"
harness = false

# Development conveniences, enabled by default.
# Build releases with `--no-default-features`.
[features]
default = ["development", "debug", "net"]
# The network: the server listens for the clients of a game of several players.
net = ["dep:lightyear"]
development = ["bevy/dynamic_linking"]
debug = ["bevy/debug"]
