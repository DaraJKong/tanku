[workspace]
members = ["music_editor", "tanku_audio", "tanku_client", "tanku_core", "tanku_server"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Versions are declared once here; each crate picks the features it needs.
[workspace.dependencies]
# Bevy stays on 0.19 until lightyear supports 0.20.
bevy = { version = "0.19", default-features = false }
# The network of co-op. Each crate picks the sides and the transports it needs.
lightyear = { version = "0.30", default-features = false }
# Announces a hosted game on the local network and finds those of others, by multicast DNS.
# Its logs show with `RUST_LOG=mdns_sd=debug`.
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
# What goes over the network is written and read with it.
serde = { version = "1", features = ["derive"] }
# SHA-256, for the proof of the password of a hosted game. It is kept at the version that
# the network library brings for its certificates, so that a build holds it once.
sha2 = "0.10"
tanku_audio = { path = "tanku_audio" }
tanku_core = { path = "tanku_core" }
# Without default features, so that a release client doesn't inherit the server's development ones.
tanku_server = { path = "tanku_server", default-features = false }
# Already part of every web build of Bevy. The client uses it for the storage of the browser,
# and to hand its music to the browser.
web-sys = "0.3"

criterion = "0.8"

# Approved, to add back when the client gets its headless mode for benchmarks:
# clap = { version = "4.6", features = ["derive"] }

# Bevy systems take many parameters and queries have long types by nature.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# The music is computed while it plays, so its crate is optimized like a dependency.
[profile.dev.package.tanku_audio]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
